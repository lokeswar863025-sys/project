services:
  - type: web
    name: nowait-restaurant
    runtime: node
    plan: free
    branch: main
    rootDir: restaurant-app
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: TAX_RATE_PERCENT
        sync: false
